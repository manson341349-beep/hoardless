name: CI

on:
  push:
    branches: [main, app-v0.1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Rule checks
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet jsonschema
          .venv/bin/python scripts/validate_rules.py
          .venv/bin/python scripts/test_validator.py
